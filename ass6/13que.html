<!DOCTYPE html>
<html lang="en">
<head>
    <title>Q13 - Interactive DOM Manipulation</title>
    <style>
        #box {
            width: 300px;
            height: 150px;
            border: 2px solid black;
            margin-top: 20px;
            padding: 10px;
        }
    </style>
</head>
<body>

    <h2>Interactive Box</h2>

    <!-- Input for background color -->
    <input type="text" id="colorInput" placeholder="Enter Color Name">

    <!-- Input for updating text -->
    <input type="text" id="textInput" placeholder="Enter Text">

    <!-- Buttons -->
    <button id="colorBtn">Change Background</button>
    <button id="textBtn">Update Text</button>

    <!-- Div to change -->
    <div id="box">This is a sample text.</div>

    <script src="13que.js"></script>

</body>
</html>
