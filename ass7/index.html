<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mini Book Management App - Home</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f5f5f5;
    }
    .container {
      background: #ffffff;
      padding: 32px 40px;
      border-radius: 8px;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 500px;
      width: 100%;
    }
    h1 {
      margin-bottom: 16px;
      font-size: 28px;
    }
    p {
      margin-bottom: 24px;
      font-size: 16px;
    }
    button {
      padding: 10px 24px;
      font-size: 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background-color: #007bff;
      color: #ffffff;
    }
    button:hover {
      opacity: 0.9;
    }
    a {
      text-decoration: none;
      color: inherit;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome to Book Management App</h1>
    <p>Click the button below to manage your books.</p>
    <!-- On click -> go to admin.html -->
    <button>
      <a href="admin.html">Go to Admin Page</a>
    </button>
  </div>
</body>
</html>
